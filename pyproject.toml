[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "cs117-feature-matching"
version = "0.1.0"
description = "Controlled SIFT, SIFT + LightGlue, and SuperPoint + LightGlue comparisons on HPatches."
readme = "README.md"
requires-python = ">=3.10"
# ABC runtime dependencies; keep aligned with requirements.txt.
# pip installs LightGlue and its dependencies automatically from this pinned revision;
# no third_party checkout is required to run train.py, evaluate.py, or demo.ipynb.
dependencies = [
    "numpy",
    "opencv-python",
    "matplotlib",
    "torch>=1.9.1",
    "torchvision>=0.8",
    "kornia>=0.6.11",
    "tqdm",
    "kagglehub",
    "ipykernel",
    "lightglue @ git+https://github.com/cvg/LightGlue.git@5a650c444718caffc2669dc0094cde908f42dd73",
]

[project.optional-dependencies]
notebook = ["jupyterlab"]

[project.urls]
Repository = "https://github.com/StevenZBX/CS-117-Final-Project"

[tool.hatch.metadata]
# Allow the pinned LightGlue Git dependency.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
# This checkout-based experiment installs dependency metadata only.
# Hatchling keeps editable-install metadata out of the source directory.
bypass-selection = true
dev-mode-dirs = ["."]
